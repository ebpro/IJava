name: SonarQube

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Analyze with SonarQube
    if: github.event_name == 'workflow_dispatch' || vars.SONAR_HOST_URL != ''
    runs-on: ${{ vars.SONAR_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Validate SonarQube configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::Set the repository variable SONAR_HOST_URL to the SonarQube URL."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set the repository secret SONAR_TOKEN to a SonarQube analysis token."
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build shadowJar packDist

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
