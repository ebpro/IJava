name: SonarQube

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Analyze with SonarQube
    if: github.event_name == 'workflow_dispatch' || vars.SONAR_HOST_URL != '' || vars.SONAR_PUBLIC_URL != ''
    runs-on: ${{ vars.SONAR_RUNNER || 'ubuntu-latest' }}
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_RUNNER && vars.SONAR_HOST_URL || vars.SONAR_PUBLIC_URL || vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_RUNNER: ${{ vars.SONAR_RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Validate SonarQube configuration
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::Set SONAR_HOST_URL or SONAR_PUBLIC_URL to the SonarQube URL."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set the repository secret SONAR_TOKEN to a SonarQube analysis token."
            exit 1
          fi
          if [ -z "$SONAR_RUNNER" ] && [[ "$SONAR_HOST_URL" == *"svc.cluster.local"* ]]; then
            echo "::error::SONAR_HOST_URL is cluster-local. Set SONAR_RUNNER to an in-cluster self-hosted runner, or set SONAR_PUBLIC_URL to an ingress/load-balancer URL."
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build shadowJar packDist

      - name: Prepare SonarQube analysis target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET_BRANCH="$BASE_REF"
            echo "SONAR_SCAN_ARGS=-Dsonar.pullRequest.key=$PR_NUMBER -Dsonar.pullRequest.branch=$HEAD_REF -Dsonar.pullRequest.base=$BASE_REF" >> "$GITHUB_ENV"
          else
            if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
              TARGET_BRANCH="$REF_NAME"
            else
              TARGET_BRANCH="master"
            fi
            echo "SONAR_SCAN_ARGS=-Dsonar.branch.name=$TARGET_BRANCH" >> "$GITHUB_ENV"
          fi
          echo "SONAR_TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Ensure SonarQube branch exists
        if: env.SONAR_TARGET_BRANCH != ''
        run: |
          response=$(curl -sS -w '\n%{http_code}' -u "$SONAR_TOKEN:" -X POST "$SONAR_HOST_URL/api/project_branches/create?projectKey=ijava&branchName=$SONAR_TARGET_BRANCH")
          http_code=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')
          if [ "$http_code" = "200" ] || [ "$http_code" = "204" ]; then
            echo "SonarQube branch ready: $SONAR_TARGET_BRANCH"
          elif printf '%s' "$body" | grep -qi "already exists"; then
            echo "SonarQube branch already exists: $SONAR_TARGET_BRANCH"
          else
            echo "::error::Failed to create SonarQube branch $SONAR_TARGET_BRANCH (HTTP $http_code): $body"
            exit 1
          fi

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          args: ${{ env.SONAR_SCAN_ARGS }} -Dsonar.projectVersion=${{ github.sha }}
          waitForQualityGate: false
