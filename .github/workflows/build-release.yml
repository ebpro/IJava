name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build package
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packDist

      - name: Prepare artifact and checksum
        run: |
          set -euo pipefail
          ARTIFACT=$(ls build/distributions/*.zip | head -n1)
          if [ -z "${ARTIFACT:-}" ]; then
            echo "No distribution zip found in build/distributions" >&2
            ls -la build || true
            exit 1
          fi
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "Created $ARTIFACT and checksum"
          ls -l "$ARTIFACT" "$ARTIFACT.sha256"

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
