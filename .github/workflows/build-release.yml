name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use for release (optional for manual dispatch)'
        required: false
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        default: 'true'
      publish:
        description: 'Create GitHub release (if false, workflow only builds and tests)'
        required: false
        default: 'true'
      run_smoke_test:
        description: 'Run smoke test before publishing'
        required: false
        default: 'true'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build distribution
    runs-on: [self-hosted, Linux, X64]
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Determine tag
        id: set-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag || '' }}" ]; then
              echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            else
              VER=$(./gradlew -q properties --no-daemon | sed -n 's/^version: //p')
              echo "tag=${VER}" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -Pversion=${{ steps.set-tag.outputs.tag }} clean packDist

      - name: Prepare artifact and checksum
        run: |
          set -euo pipefail
          TAG=${{ steps.set-tag.outputs.tag }}
          ARTIFACT="build/distributions/IJava-${TAG}.zip"
          if [ ! -f "$ARTIFACT" ]; then
            ARTIFACT=$(ls build/distributions/*.zip | head -n1 || true)
            if [ -z "$ARTIFACT" ]; then
              echo "No distribution zip found in build/distributions" >&2
              ls -la build || true
              exit 1
            fi
          fi
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          echo "Prepared $ARTIFACT and checksum"
          ls -l "$ARTIFACT" "${ARTIFACT}.sha256"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            build/distributions/IJava-${{ steps.set-tag.outputs.tag }}.zip
            build/distributions/IJava-${{ steps.set-tag.outputs.tag }}.zip.sha256

  smoke-test:
    name: Smoke-test distribution
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_smoke_test == 'true' }}
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution

      - name: Run smoke test (unpack & start briefly)
        run: |
          set -euo pipefail
          # prepare workspace
          DIST=$(ls -1 *.zip | grep IJava || true)
          if [ -z "$DIST" ]; then
            echo "Distribution zip not found in artifact" >&2
            ls -la || true
            exit 1
          fi
          echo "Using distribution: $DIST"
          rm -rf smoke && mkdir -p smoke
          unzip -q "$DIST" -d smoke

          # locate jar
          JAR=$(find smoke -type f -name "*-all.jar" -print -quit)
          if [ -z "$JAR" ]; then
            JAR=$(find smoke -type f -name "*.jar" -print -quit)
          fi
          if [ -z "$JAR" ]; then
            echo "No jar found inside distribution" >&2
            ls -R smoke || true
            exit 1
          fi
          echo "Found jar: $JAR"

          # create connection file and ensure cleanup on exit
          CONN=$(mktemp --suffix=.json)
          KPID=""
          cleanup() {
            if [ -n "${KPID:-}" ]; then
              kill "$KPID" 2>/dev/null || true
              wait "$KPID" 2>/dev/null || true
            fi
            rm -f "${CONN:-}" || true
            rm -rf smoke || true
          }
          trap cleanup EXIT

          # create a minimal isolated venv under smoke/ and run a notebook against the unpacked jar
          CONN=$(mktemp --suffix=.json)
          echo "Connection file: $CONN"

          # create venv inside smoke so cleanup removes it
          python3 -m venv smoke/venv
          . smoke/venv/bin/activate
          pip install --upgrade pip
          pip install --no-cache-dir jupyter nbconvert jupyter-client >/dev/null

          # prepare a kernelspec that launches the unpacked jar
          JAR_ABS=$(realpath "$JAR")
          KS_DIR=$(mktemp -d)
          mkdir -p "$KS_DIR/ijavatest"
          cat > "$KS_DIR/ijavatest/kernel.json" <<'EOF'
{
  "argv": ["java","-jar","__JAR_PATH__","{connection_file}"],
  "display_name": "IJava-SmokeTest",
  "language": "java"
}
EOF
          sed -i "s|__JAR_PATH__|${JAR_ABS}|g" "$KS_DIR/ijavatest/kernel.json"

          # install kernelspec into the venv (sys-prefix keeps it inside venv)
          jupyter kernelspec install --sys-prefix "$KS_DIR/ijavatest" --name ijavatest --replace

          # create a minimal notebook that exercises the kernel
          cat > smoke/hello.ipynb <<'JSON'
{
 "cells": [
  {
   "cell_type": "code",
   "metadata": {},
   "outputs": [],
   "source": [
    "System.out.println(\"hello from ijava smoke test\");"
   ]
  }
 ],
 "nbformat": 4,
 "nbformat_minor": 2,
 "metadata": {}
}
JSON

          # execute the notebook using the temporary kernel; fail on any error
          jupyter nbconvert --to notebook --execute smoke/hello.ipynb \
            --ExecutePreprocessor.timeout=60 \
            --ExecutePreprocessor.kernel_name=ijavatest \
            --output smoke/executed.ipynb

          # deactivate venv; smoke/ will be removed by the existing cleanup trap
          deactivate || true

  publish:
    name: Create Release
    needs: [build, smoke-test]
    runs-on: [self-hosted, Linux, X64]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          body_path: UPGRADE.md
          files: |
            IJava-${{ needs.build.outputs.tag }}.zip
            IJava-${{ needs.build.outputs.tag }}.zip.sha256
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true') || (github.event_name != 'workflow_dispatch' && (contains(github.ref, '-pr') || contains(github.ref, '-rc'))) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
