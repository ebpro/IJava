name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use for release (optional for manual dispatch)'
        required: false
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        default: 'true'
      publish:
        description: 'Create GitHub release (if false, workflow only builds and tests)'
        required: false
        default: 'true'
      run_smoke_test:
        description: 'Run smoke test before publishing'
        required: false
        default: 'true'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build package
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packDist

      - name: Determine tag
        id: set-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag || '' }}" ]; then
              echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            else
              VER=$(./gradlew -q properties --no-daemon | sed -n 's/^version: //p')
              echo "tag=${VER}" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifact and checksum
        run: |
          set -euo pipefail
          TAG=${{ steps.set-tag.outputs.tag }}
          ARTIFACT=$(ls build/distributions/*.zip | head -n1)
          if [ -z "${ARTIFACT:-}" ]; then
            echo "No distribution zip found in build/distributions" >&2
            ls -la build || true
            exit 1
          fi
          TARGET="build/distributions/IJava-${TAG}.zip"
          cp "$ARTIFACT" "$TARGET"
          sha256sum "$TARGET" > "$TARGET.sha256"
          echo "Prepared $TARGET and checksum"
          ls -l "$TARGET" "$TARGET.sha256"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            build/distributions/IJava-${{ steps.set-tag.outputs.tag }}.zip
            build/distributions/IJava-${{ steps.set-tag.outputs.tag }}.zip.sha256

  smoke-test:
    name: Smoke-test distribution
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_smoke_test == 'true' }}
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution

      - name: Run smoke test (unpack & start briefly)
        run: |
          set -euo pipefail
          DIST=$(ls -1 *.zip | grep IJava || true)
          if [ -z "$DIST" ]; then
            echo "Distribution zip not found in artifact" >&2
            ls -la || true
            exit 1
          fi
          echo "Using distribution: $DIST"
          rm -rf smoke && mkdir -p smoke
          unzip -q "$DIST" -d smoke
          JAR=$(find smoke -type f -name "*-all.jar" -print -quit)
          if [ -z "$JAR" ]; then
            JAR=$(find smoke -type f -name "*.jar" -print -quit)
          fi
          if [ -z "$JAR" ]; then
            echo "No jar found inside distribution" >&2
            ls -R smoke || true
            exit 1
          fi
          echo "Found jar: $JAR"

          CONN=$(mktemp --suffix=.json)
          python3 -c 'import json, random; ports = [random.randint(15000, 30000) for _ in range(5)]; keys = ["shell_port","iopub_port","stdin_port","control_port","hb_port"]; d = dict(zip(keys, ports)); d.update({"ip": "127.0.0.1", "transport": "tcp", "signature_scheme": "hmac-sha256", "key": ""}); print(json.dumps(d))' > "$CONN"
          echo "Connection file: $CONN"
          java -jar "$JAR" "$CONN" >/dev/null 2>&1 &
          KPID=$!
          echo "Kernel PID: $KPID"
          sleep 5
          if kill -0 "$KPID" >/dev/null 2>&1; then
            echo "Kernel started (PID $KPID) - killing"
            kill "$KPID" || true
            wait "$KPID" || true
          else
            echo "Kernel process exited prematurely" >&2
            ps aux | head -n 20 || true
            exit 1
          fi

  publish:
    name: Create Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution

        - name: Create GitHub Release and upload assets
          uses: softprops/action-gh-release@v1
          with:
            body_path: UPGRADE.md
            files: |
              IJava-${{ github.ref_name }}.zip
              IJava-${{ github.ref_name }}.zip.sha256
            prerelease: ${{ github.event_name == 'workflow_dispatch' ? (github.event.inputs.prerelease == 'true') : (contains(github.ref, '-pr') || contains(github.ref, '-rc')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

